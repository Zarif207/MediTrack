# Render Blueprint: Dashboard → New → Blueprint → pick this repository.
# Creates two free-tier services. Nothing is created until you confirm there.
# Values marked `sync: false` are secrets: Render asks for them on first apply
# and they never live in Git. The database is external (e.g. Neon free tier);
# paste its connection string as DATABASE_URL.
services:
  - type: web
    name: meditrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations are idempotent and additive, so running them on each start is safe.
    startCommand: python -m migrations && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: APP_ENV
        value: production
      - key: DB_ECHO
        value: "false"
      - key: DATABASE_URL
        sync: false
      # Upload the service-account JSON as a Secret File named
      # firebase-service-account.json (Environment → Secret Files).
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/firebase-service-account.json
      - key: FIREBASE_PROJECT_ID
        value: meditrack-7fe46
      - key: ALLOWED_ORIGINS
        sync: false            # https://<your-frontend>.onrender.com
      - key: PUBLIC_APP_URL
        sync: false            # same frontend URL; Stripe returns the browser here
      - key: STRIPE_SECRET_KEY
        sync: false            # sk_test_… only; live keys are refused at startup
      - key: STRIPE_WEBHOOK_SECRET
        sync: false            # whsec_… from the Stripe test-mode webhook endpoint
      - key: STRIPE_CURRENCY
        value: usd

  - type: web
    name: meditrack-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Single-page app: every route (including the Stripe return URL) serves index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false            # https://<your-api>.onrender.com
      - key: VITE_CURRENCY
        value: USD
      # Firebase web config (public values, from Firebase Console → Your apps).
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        value: meditrack-7fe46
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
